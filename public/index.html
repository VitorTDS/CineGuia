<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CineGuia · Onde assistir filmes e séries</title>
  <meta name="description" content="Encontre sinopse, trailer e onde assistir qualquer filme ou série no Brasil.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="CineGuia, página inicial">
        <span class="brand-mark" aria-hidden="true">▶</span>
        CineGuia
      </a>

      <form class="search" id="searchForm" role="search">
        <label class="visually-hidden" for="searchInput">Buscar filme ou série</label>
        <input id="searchInput" type="search" placeholder="Buscar filme ou série..." autocomplete="off" maxlength="100">
      </form>

      <button type="button" class="icon-button theme-toggle" id="themeToggle" aria-label="Alternar tema claro/escuro"></button>
    </div>

    <nav class="tabs" id="tabs" aria-label="Categorias">
      <button type="button" class="tab active" data-category="trending" aria-pressed="true">Em alta</button>
      <button type="button" class="tab" data-category="movies" aria-pressed="false">Filmes</button>
      <button type="button" class="tab" data-category="series" aria-pressed="false">Séries</button>
      <button type="button" class="tab" data-category="favorites" aria-pressed="false">♥ Minha lista</button>
    </nav>

    <form class="filters hidden" id="filters" aria-label="Filtros">
      <label>
        <span>Gênero</span>
        <select id="filterGenre">
          <option value="">Todos</option>
        </select>
      </label>
      <label>
        <span>Época</span>
        <select id="filterDecade">
          <option value="">Qualquer</option>
          <option value="2020-2029">Anos 2020</option>
          <option value="2010-2019">Anos 2010</option>
          <option value="2000-2009">Anos 2000</option>
          <option value="1990-1999">Anos 90</option>
          <option value="1980-1989">Anos 80</option>
          <option value="1970-1979">Anos 70</option>
          <option value="1870-1969">Antes de 1970</option>
        </select>
      </label>
      <label>
        <span>Nota mínima</span>
        <select id="filterRating">
          <option value="">Qualquer</option>
          <option value="6">6+</option>
          <option value="7">7+</option>
          <option value="8">8+</option>
        </select>
      </label>
      <button type="reset" class="filters-clear" id="filtersClear">Limpar filtros</button>
    </form>
  </header>

  <main class="content">
    <h1 class="section-title" id="sectionTitle">Em alta nesta semana</h1>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="sentinel" aria-hidden="true"></div>
    <button type="button" class="load-more hidden" id="loadMore">Tentar novamente</button>
  </main>

  <footer class="footer">
    <p>
      Dados de filmes e séries fornecidos pelo
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a>.
      Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.
    </p>
    <p>
      Informações de onde assistir fornecidas pela
      <a href="https://www.justwatch.com/br" target="_blank" rel="noopener noreferrer">JustWatch</a>.
    </p>
  </footer>

  <dialog class="details" id="details" aria-labelledby="detailsTitle">
    <button type="button" class="close-button" id="closeDetails" aria-label="Fechar">×</button>
    <div id="detailsBody"></div>
  </dialog>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
